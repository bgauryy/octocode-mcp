<!doctype html>
<html lang="en">
  <title>Text scope without main</title>
  <body>
    <header>Evidence before articles</header>
    <article>
      <h1>First article</h1>
      <p>First article evidence</p>
    </article>
    <section id="second" aria-label="Second region">
      <article>
        <h2>Second article</h2>
        <p>Second article evidence</p>
      </article>
    </section>
    <p hidden>Hidden evidence</p>
    <footer>Evidence after articles</footer>
  </body>
</html>
