[package]
name = "octocode-io"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The one owner of the primitives Octocode crates share (listed in src/lib.rs)"

# No doctests: nextest runs the tests (crates/runtime/Cargo.toml).
[lib]
doctest = false

[dependencies]
getrandom = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros"] }

[lints]
workspace = true
