# cargo-deny configuration for octocode-native.
# Run: yarn deny   (requires: cargo install cargo-deny)

[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]

# ── Advisories (security CVEs) ────────────────────────────────────────────────────────────────
# Single advisory policy for the repo (`cargo deny` is the only audit gate;
# `cargo audit` is not run). Schema v2: vulnerability and unsound advisories
# always fail. Unmaintained advisories fail for every crate, transitive ones
# included; each accepted exception is listed below with its reason.
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
yanked = "deny"
ignore = [
    # unsafe-libyaml reaches the tree only through serde_yaml 0.9, which
    # ast-grep-config (the structural-search engine) pins. Remove this entry
    # when ast-grep moves off serde_yaml.
    { id = "RUSTSEC-2024-0449", reason = "transitive via ast-grep-config -> serde_yaml 0.9; no fixed upstream release yet" },
]

# ── Licenses ──────────────────────────────────────────────────────────────────────────────
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
# Schema v2: `unlicensed`/`copyleft`/`allow-osi-fsf-free`/`default` were removed
# (and now error); anything not in `allow` is denied.
confidence-threshold = 0.8

# ── Bans (duplicate crates, banned crates) ────────────────────────────────────────────────
[bans]
multiple-versions = "warn"   # warn on duplicated semver-incompatible crates
wildcards = "deny"          # no wildcard versions in Cargo.toml
allow-wildcard-paths = true # versionless path deps between our publish=false crates
# Each entry is a duplicate that upstream crates force; a new duplicate, or one
# whose version moves, shows up as a warning until it is listed here.
skip = [
    # Upstream: ast-grep and oxc pin syn 2; newer proc-macro crates use syn 3.
    { name = "syn", version = "2.0.119" },
    # Upstream: num-bigint 0.4 (oxc) and 0.5 (newer numeric crates) coexist.
    { name = "num-bigint", version = "0.4.8" },
    # Upstream: core-foundation 0.9 (keyring/security stacks) and 0.10 (reqwest).
    { name = "core-foundation", version = "0.9.4" },
]

# ── Sources (crate registry allow-list) ──────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
