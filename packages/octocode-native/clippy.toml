allow-unwrap-in-tests = true
# Ceiling for non-exempt functions. The structural matcher's recursive
# `match_multi_capture` (structural/octo/pattern.rs) threads 9 arguments; the
# two at 10 (`match_multi_split`, `walk_expanding`) carry `#[expect]` with a
# reason.
too-many-arguments-threshold = 9
disallowed-methods = [
    { path = "alloc::string::String::leak", reason = "leaks per call in a long-lived server process — bind to a local instead" },
]
